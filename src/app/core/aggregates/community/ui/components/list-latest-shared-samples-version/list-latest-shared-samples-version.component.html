<div class=" h-80 flex flex-col gap-1 ">
  <p class="text-white text-lg">Shared samples</p>
  <div class="flex items-center flex-1">
    @for(sample of listSharedSamples(); track sample.id){
      <app-sample-card-shared [sample]="sample" />
    }@empty{
      <div class="flex items-center justify-center w-full h-full">
        <p class="text-white text-center w-full">The community hasn't shared anything yet.</p>
      </div>
    }
  </div>
</div>
