<div class="h-full flex flex-col">
  <div class="pt-6 px-4 pb-2">
    <p class="text-white text-xl">Shared edit samples</p>
  </div>

  @if (error()) {
    <div class="mx-4 mb-2 flex items-center justify-between p-3 rounded-xl border border-red-900/30 bg-red-950/10 text-xs">
      <span class="text-red-400 font-medium">{{ error() }}</span>
      <button
        (click)="retrySharedEditSamples()"
        class="px-3 py-1 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 rounded-md transition-colors cursor-pointer"
      >
        Retry
      </button>
    </div>
  }

  <div class="flex-1 min-h-0">
    <app-infinite-scroll
      [data]="samples()"
      [renderItem]="itemTemplate"
      [keyExtractor]="keyExtractor"
      [isLoading]="isLoading()"
      [hasMore]="hasMore()"
      [getMore]="getMoreSharedEditSamples"
      [styleData]="styleData"
      emptyText="There are no shared edit samples to view."
    >
      <ng-template #itemTemplate let-sample>
        <app-sample-card-shared-edit [sample]="sample" />
      </ng-template>
    </app-infinite-scroll>
  </div>
</div>
